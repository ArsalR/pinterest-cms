name: PR checks

on:
  pull_request: {}
  workflow_dispatch: {}

jobs:
  checks:
    runs-on: ubuntu-latest
    name: Typecheck + tests
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install dependencies
        run: npm ci

      - name: Type check
        run: npm run typecheck

      - name: Tests
        run: npm test
