name = "pinterest-cms"
main = "src/worker.ts"
compatibility_date = "2025-05-01"
compatibility_flags = ["nodejs_compat"]

# R2 bucket — all sites share this, namespaced by hostname.
[[r2_buckets]]
binding     = "R2_BUCKET"
bucket_name = "cms-media"

# Workers Analytics Engine — first-party analytics beacon ingest (V1.5 M3).
# High-volume, cheap, cardinality-safe writes; queried by the nightly rollup via
# the AE SQL API. Inert until FEATURE_ANALYTICS = "1"; the binding is optional in
# code (guarded), so a deploy without the dataset provisioned still runs.
[[analytics_engine_datasets]]
binding = "ANALYTICS"
dataset = "site_beacon"

# Public-facing config (non-secret).
[vars]
TURSO_ORG              = "arsalr"
TURSO_GROUP            = "default"
NETWORK_ADMIN_HOSTNAME = "pinterest-cms.arsalriaz34.workers.dev"
R2_PUBLIC_URL          = "https://pub-ed7c257e9365434d921f9a37b122bc23.r2.dev"
SESSION_COOKIE_NAME    = "cms_session"
FEATURE_IDEMPOTENCY    = ""
FEATURE_WEBHOOKS       = ""
FEATURE_RATE_LIMIT     = ""
FEATURE_BATCH_POSTS    = ""
FEATURE_ANALYTICS      = ""
GC_ENABLED             = ""
RATE_LIMIT_RPM         = "60"
# SaaS layer (saas_mode) — set SAAS_MODE = "1" + hostname to enable.
# Secrets (wrangler secret put): SAAS_JWT_SECRET, RESEND_API_KEY,
# VAULT_MASTER_KEY, GITHUB_APP_ID, GITHUB_APP_PRIVATE_KEY.
SAAS_MODE              = ""
SAAS_APP_HOSTNAME      = ""
SAAS_PBKDF2_ITERATIONS = ""
GITHUB_APP_SLUG        = ""
SAAS_TEMPLATE_REPO     = "ArsalR/site-template"
SAAS_CMS_HOST_SUFFIX   = "cms.arsal.app"

[triggers]
crons = ["*/5 * * * *", "0 4 * * *"]

[observability]
enabled = true
