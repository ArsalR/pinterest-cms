name = "pinterest-cms"
main = "src/worker.ts"
compatibility_date = "2025-05-01"
compatibility_flags = ["nodejs_compat"]

# R2 bucket — all sites share this, namespaced by hostname.
[[r2_buckets]]
binding     = "R2_BUCKET"
bucket_name = "cms-media"

# Public-facing config (non-secret).
[vars]
TURSO_ORG              = "arsalr"
TURSO_GROUP            = "default"
NETWORK_ADMIN_HOSTNAME = "pinterest-cms.arsalriaz34.workers.dev"
R2_PUBLIC_URL          = "https://pub-ed7c257e9365434d921f9a37b122bc23.r2.dev"
SESSION_COOKIE_NAME    = "cms_session"
FEATURE_IDEMPOTENCY    = ""
FEATURE_WEBHOOKS       = ""
FEATURE_RATE_LIMIT     = ""
FEATURE_BATCH_POSTS    = ""
GC_ENABLED             = ""
RATE_LIMIT_RPM         = "60"

[triggers]
crons = ["*/5 * * * *", "0 4 * * *"]

# Raise CPU time limit for PBKDF2 password hashing (login + API key validation).
# Requires Workers Paid plan ($5/month). Free tier is capped at 10ms and will
# cause login to fail under load — do NOT deploy to production on the free tier.
[limits]
cpu_ms = 30000

[observability]
enabled = true
